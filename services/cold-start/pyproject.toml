[project]
name = "association-cold-start"
version = "0.1.0"
description = "将单份协会手册 PDF 编译为长期记忆候选的冷启动工作流"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "docling>=2.114.0,<3",
  "httpx>=0.28.1,<1",
  "langgraph>=1.2.9,<2",
  "pydantic>=2.12.5,<3",
  "python-dotenv>=1.2.2,<2",
]

[project.scripts]
cold-start = "cold_start.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10",
  "pytest-asyncio>=1.3.0,<2",
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cold_start"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
